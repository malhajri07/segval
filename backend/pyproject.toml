[project]
name = "segval"
version = "0.1.0"
description = "No-code graph segmentation platform for telecom (Neo4j + Cypher)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "neo4j>=5.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
segval-seed = "segval.seed.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["segval*"]

[tool.setuptools.package-data]
"segval.catalog" = ["*.yaml"]
"segval.templates" = ["*.yaml"]
"segval.graph" = ["*.cypher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Test-case tables read best one case per line.
"tools/*" = ["E501"]
